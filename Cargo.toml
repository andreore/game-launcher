# Корень рабочего пространства Cargo.
#
# Проект разделён на два крейта сознательно: `launcher-core` — вся логика
# лаунчера, `src-tauri` — только оболочка с окном и интерфейсом.
# Благодаря этому ядро собирается и тестируется без системных библиотек GUI.
[workspace]
members = ["src-tauri", "crates/launcher-core"]
resolver = "3"

# Профиль задаётся только в корне рабочего пространства — здесь, иначе Cargo
# его игнорирует. Файл лаунчера получается меньше и без отладочной информации.
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
